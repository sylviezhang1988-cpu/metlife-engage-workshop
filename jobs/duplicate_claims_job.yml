# Starter job for the optional Genie Code CLI lab.
# Import with Databricks Asset Bundles or paste into Workflows UI.
# Replace catalog/schema and warehouse_id.

resources:
  jobs:
    flag_duplicate_claims_daily:
      name: flag-duplicate-claims-daily
      schedule:
        quartz_cron_expression: "0 0 8 * * ?"
        timezone_id: America/New_York
      tasks:
        - task_key: flag_duplicates
          sql_task:
            warehouse_id: REPLACE_WAREHOUSE_ID
            file:
              path: ../sql/duplicate_claims.sql
